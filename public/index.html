<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Ola Verde — Panel Operativo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f4f6f8; font-family: system-ui, -apple-system, sans-serif; }
    .brand-green { background-color: #2d7a31; }
    .brand-green:hover { background-color: #246327; }
    .text-brand { color: #2d7a31; }
  </style>
</head>
<body class="p-4 md:p-8 text-gray-800">

  <div class="max-w-6xl mx-auto space-y-6">
    <header class="space-y-1">
      <h1 class="text-3xl font-bold text-brand flex items-center gap-2">🌱 La Ola Verde — Panel Operativo</h1>
      <p class="text-gray-600 text-sm md:text-base">Monitoreo y registro de ruta de riego, árboles y biodiversidad.</p>
    </header>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <span class="text-xs font-semibold text-gray-500 uppercase">Árboles Regados</span>
        <div class="text-2xl font-bold text-brand mt-1" id="kpi-arboles">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <span class="text-xs font-semibold text-gray-500 uppercase">Litros Aplicados</span>
        <div class="text-2xl font-bold text-blue-600 mt-1" id="kpi-litros">0 L</div>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <span class="text-xs font-semibold text-gray-500 uppercase">Especies Atendidas</span>
        <div class="text-2xl font-bold text-amber-600 mt-1" id="kpi-especies">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <span class="text-xs font-semibold text-gray-500 uppercase">Aves Registradas</span>
        <div class="text-2xl font-bold text-purple-600 mt-1" id="kpi-aves">0</div>
      </div>
    </div>

    <section class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
      <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">📋 Registro de Ruta de Riego</h2>
      <form id="registro-form" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Código de Lote / Sector:</label>
            <input type="text" id="lote" placeholder="Ej. SECTOR-NORTE-01" required class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Operador ID:</label>
            <input type="text" id="operador" placeholder="Ej. OP-CARLOS" required class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Número de Árboles Regados:</label>
            <input type="number" id="arboles" placeholder="15" min="1" required class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Litros de Agua Aplicados:</label>
            <input type="number" step="0.1" id="litros" placeholder="250.00" min="0" required class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Especie de Árbol / Planta:</label>
            <input type="text" id="especie" placeholder="Ej. Lirio, Mesquite, Amapa" required class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Aves / Fauna Avistada:</label>
            <input type="number" id="aves" placeholder="0" min="0" value="0" class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Estado del Sector:</label>
            <select id="estado" class="w-full px-3 py-2 border rounded-lg text-sm">
              <option value="Excelente">Excelente (Follaje sano)</option>
              <option value="Bueno">Bueno (Estrés hídrico leve)</option>
              <option value="Atención">Requiere Atención (Plaga/Seco)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-red-700 uppercase mb-1">🔑 Clave de Seguridad del Proyecto:</label>
            <input type="password" id="pin" placeholder="PIN de acceso (1234)" required class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
        </div>
        <button type="submit" class="w-full brand-green text-white font-bold py-3 rounded-lg shadow text-base">💾 Guardar Registro Seguro en Neon</button>
      </form>
    </section>

    <section class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-gray-800">📊 Registros en Base de Datos</h2>
        <button onclick="cargarTabla()" class="brand-green text-white font-semibold px-3 py-1.5 rounded-lg text-sm">🔄 Actualizar</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm border-collapse">
          <thead>
            <tr class="brand-green text-white">
              <th class="p-3">Lote</th>
              <th class="p-3">Árboles</th>
              <th class="p-3">Litros</th>
              <th class="p-3">Especie</th>
              <th class="p-3">Aves</th>
              <th class="p-3">Estado</th>
              <th class="p-3">Operador</th>
              <th class="p-3">Fecha / Hora</th>
            </tr>
          </thead>
          <tbody id="tabla-body" class="divide-y divide-gray-200"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    document.getElementById('registro-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const payload = {
        lote: document.getElementById('lote').value,
        operador: document.getElementById('operador').value,
        arboles: parseInt(document.getElementById('arboles').value),
        litros: parseFloat(document.getElementById('litros').value),
        especie: document.getElementById('especie').value,
        aves: parseInt(document.getElementById('aves').value) || 0,
        estado: document.getElementById('estado').value,
        pin: document.getElementById('pin').value
      };

      try {
        const res = await fetch('/api/registros', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) {
          const errData = await res.json();
          alert('❌ ' + (errData.error || 'Error al guardar'));
          return;
        }
        alert('✅ ¡Registro guardado exitosamente!');
        document.getElementById('registro-form').reset();
        cargarTabla();
      } catch (err) {
        alert('❌ Error de conexión.');
      }
    });

    async function cargarTabla() {
      try {
        const res = await fetch('/api/registros');
        const registros = await res.json();
        const tbody = document.getElementById('tabla-body');
        tbody.innerHTML = '';

        let totalArboles = 0, totalLitros = 0, totalAves = 0;
        const especiesSet = new Set();

        if (registros.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" class="text-center py-6 text-gray-500">No hay registros guardados.</td></tr>`;
        } else {
          registros.forEach(r => {
            totalArboles += Number(r.arboles);
            totalLitros += Number(r.litros);
            totalAves += Number(r.aves);
            if (r.especie) especiesSet.add(r.especie.trim().toLowerCase());

            const fila = document.createElement('tr');
            fila.className = "hover:bg-gray-50 transition";
            fila.innerHTML = `
              <td class="p-3 font-bold text-gray-700">${r.lote}</td>
              <td class="p-3 font-semibold text-green-700">${r.arboles}</td>
              <td class="p-3">${r.litros} L</td>
              <td class="p-3">${r.especie}</td>
              <td class="p-3">${r.aves}</td>
              <td class="p-3"><span class="px-2 py-1 rounded text-xs font-bold ${r.estado === 'Excelente' ? 'bg-green-100 text-green-800' : 'bg-blue-100 text-blue-800'}">${r.estado}</span></td>
              <td class="p-3">${r.operador}</td>
              <td class="p-3 text-xs text-gray-500">${new Date(r.creado_en).toLocaleString('es-MX')}</td>
            `;
            tbody.appendChild(fila);
          });
        }

        document.getElementById('kpi-arboles').innerText = totalArboles;
        document.getElementById('kpi-litros').innerText = totalLitros.toFixed(1) + ' L';
        document.getElementById('kpi-especies').innerText = especiesSet.size;
        document.getElementById('kpi-aves').innerText = totalAves;
      } catch (err) {
        console.error("Error al cargar la tabla:", err);
      }
    }
    cargarTabla();
  </script>
</body>
</html>
